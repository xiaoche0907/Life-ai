<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #card {
    position: absolute; inset: 12px;
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--text);
  }
  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    cursor: grab;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: #fff; }
  #head .title svg { width: 16px; height: 16px; color: var(--accent-text); }
  #head .sp { flex: 1; }
  .hbtn {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer;
    background: var(--btn-bg);
  }
  .hbtn:hover { background: var(--btn-bg-hover); }

  #list {
    flex: 1; overflow-y: auto;
    padding: 0 14px 12px;
    display: flex; flex-direction: column; gap: 3px;
    font-size: 11px; line-height: 1.5;
    font-family: Consolas, "Microsoft YaHei", monospace;
    user-select: text;
  }
  .ln { display: flex; gap: 8px; }
  .ln .t { color: var(--text-dim); flex-shrink: 0; }
  .ln .m { color: var(--text); opacity: 0.88; word-break: break-all; }
  .ln.ok .m { color: var(--ok); }
  .ln.err .m { color: var(--err); }
  #empty { text-align: center; color: var(--text-dim); padding: 26px 0; letter-spacing: 1px; }
</style>
</head>
<body>
<script src="icons.js"></script>
<div id="card" class="lg">
  <div id="head">
    <span class="title"><span id="ico"></span>生图日志</span>
    <div class="sp"></div>
    <div class="hbtn" id="btnClear" title="清空日志"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></div>
  </div>
  <div id="list"><div id="empty">日志会出现在这里</div></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('ico').innerHTML = window.ORANGE_ICONS.logs;
  $('btnClear').addEventListener('click', () => window.orange.clearOlog());

  const list = $('list');
  function fmt(ts) {
    const d = new Date(ts);
    const p = (n) => (n < 10 ? '0' : '') + n;
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function addLine(l, skipScroll) {
    const e = $('empty');
    if (e) e.remove();
    const div = document.createElement('div');
    div.className = 'ln ' + (l.type || 'info');
    div.innerHTML = '<span class="t">' + fmt(l.ts) + '</span><span class="m"></span>';
    div.querySelector('.m').textContent = l.msg;
    list.appendChild(div);
    while (list.children.length > 500) list.removeChild(list.firstChild);
    if (!skipScroll) list.scrollTop = list.scrollHeight;
  }
  window.orange.onOlog((l) => addLine(l));
  window.orange.onOlogClear(() => { list.innerHTML = '<div id="empty">日志会出现在这里</div>'; });
  (async () => {
    const logs = await window.orange.getOlog();
    logs.forEach((l) => addLine(l, true));
    list.scrollTop = list.scrollHeight;
  })();
</script>
<script src="glass.js"></script>
</body>
</html>
