<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #card {
    position: absolute; inset: 12px;
    border-radius: 24px;
    display: flex; flex-direction: column;
    color: var(--text);
    overflow: hidden;
  }
  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    cursor: grab;
  }
  #head:active { cursor: grabbing; }
  #head .title { font-size: 15px; font-weight: 600; color: #fff; }
  #head .sp { flex: 1; }
  .hbtn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
    background: var(--btn-bg);
  }
  .hbtn:hover { background: var(--btn-bg-hover); }

  #body {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
  }
  #bigIco { font-size: 56px; opacity: 0.55; color: var(--accent-text); }
  #bigIco svg { width: 58px; height: 58px; }
  #msg { font-size: 13px; color: #fff; opacity: 0.78; letter-spacing: 1px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="waterEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3"/>
    </filter>
  </defs>
</svg>
<div id="card" class="lg">
  <div id="head">
    <span class="title" id="title">…</span>
    <div class="sp"></div>
  </div>
  <div id="body">
    <div id="bigIco">🚧</div>
    <div id="msg">功能开发中，即将迁移</div>
  </div>
</div>
<script src="icons.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const mid = q.get('id');
  const svg = (window.ORANGE_ICONS && window.ORANGE_ICONS[mid]) || null;
  document.getElementById('title').textContent = q.get('label') || '未命名';
  if (svg) document.getElementById('bigIco').innerHTML = svg;
  else document.getElementById('bigIco').textContent = q.get('icon') || '🚧';
  // 深色主题（body不加light类即深色）
</script>
<script src="glass.js"></script>
</body>
</html>
