<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #panel {
    position: absolute; inset: 12px;
    border-radius: 26px;
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--text);
  }

  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 8px;
    cursor: grab;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #fff; }
  #head .title svg { width: 19px; height: 19px; color: var(--accent-text); }
  #head .sp { flex: 1; }
  .hbtn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
    background: var(--btn-bg);
    transition: background 0.2s;
  }
  .hbtn:hover { background: var(--btn-bg-hover); }
  #btnClose { font-size: 15px; color: #fff; line-height: 1; }


  /* 网格与气泡全部用vw定尺：窗口拉多窄，图标/文字/间距同步等比缩小，永远一排4个 */
  #grid {
    flex: 1; overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2.85vw;
    padding: 1.4vw 3.8vw 3.8vw;
    align-content: start;
  }
  #grid::-webkit-scrollbar { width: 0; }

  /* ---------- 方形功能气泡（液态玻璃小方块，真模糊面板基底） ---------- */
  .bubble {
    aspect-ratio: 1;
    border-radius: 4.76vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.43vw;
    cursor: grab;
    transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
  }
  .bubble:hover {
    background: var(--lg-tile-hover);
    transform: translateY(-3px);
  }
  .bubble:active { cursor: grabbing; transform: scale(0.94); }
  .bubble .ico { display: flex; color: var(--accent-text); }
  .bubble .ico svg { width: 5.95vw; height: 5.95vw; }
  .bubble .lab { font-size: 2.62vw; color: #fff; letter-spacing: 0.12vw; white-space: nowrap; }
  .bubble.stub .ico { opacity: 0.55; }
  /* 已打开的模块：主题色内部填充 + 边缘发光 */
  .bubble.open {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    box-shadow: 0 0 10px var(--accent-soft), 0 0 3px var(--accent-border);
  }
  .bubble.open .lab { color: var(--accent-text); }
  /* 学员特供占位（阉割版）：阉割板块的气泡永久置灰，不可点不可拖；只用颜色/透明度压灰，不用 filter（透明窗铁律1） */
  .bubble.locked { cursor: not-allowed; background: rgba(140, 140, 140, 0.10); border: 1px dashed rgba(255, 255, 255, 0.16); }
  .bubble.locked:hover { background: rgba(140, 140, 140, 0.10); transform: none; }
  .bubble.locked:active { transform: none; cursor: not-allowed; }
  .bubble.locked .ico { color: #8d8d8d; opacity: 0.45; }
  .bubble.locked .lab { color: #8d8d8d; }
  .bubble.locked .badge { background: rgba(120, 120, 120, 0.35); color: #d6d6d6; border-color: rgba(255, 255, 255, 0.22); }
  /* 点灰气泡的说明气泡：一闪即隐，不占位（学员反馈"点了没反应"，得说清是版本没有而不是坏了） */
  #lockTip {
    position: fixed; left: 50%; bottom: 2.5vw; transform: translateX(-50%);
    max-width: 88%; padding: 1.1vw 2.2vw; border-radius: 2vw;
    background: rgba(30, 30, 30, 0.92); color: #e8e8e8; font-size: 2.1vw; line-height: 1.5;
    text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.18s ease;
  }
  #lockTip.on { opacity: 1; }
  /* 批处理已激活：气泡持续呼吸强闪——批模式一开生成就连跑N张图，必须一眼看见 */
  .bubble.batch-live {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    animation: batchPulse 1.1s ease-in-out infinite;
  }
  .bubble.batch-live .lab { color: var(--accent-text); }
  @keyframes batchPulse {
    0%, 100% { box-shadow: 0 0 3px var(--accent-border); }
    50% { box-shadow: 0 0 16px 4px var(--accent); }
  }
  .bubble .badge {
    position: absolute; top: 1.67vw; right: 1.67vw;
    font-size: 1.9vw; padding: 0.24vw 1.19vw; border-radius: 1.67vw;
    line-height: 1.4; white-space: nowrap;
    background: var(--accent-soft); color: var(--accent-text);
    border: 1px solid var(--accent-border);
  }
</style>
</head>
<body>
<script src="icons.js"></script>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="waterEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3"/>
    </filter>
  </defs>
</svg>
<div id="panel" class="lg">
  <div id="head">
    <span class="title" title="点击气泡展开/收回 · 按住拖出可钉在任意位置"><span id="logoIco"></span>控制台</span>
    <div class="sp"></div>
    <div class="hbtn" id="btnClose" title="收起控制台（软件继续后台运行，右键小球→控制台 可再次打开）">×</div>
  </div>
  <div id="grid"></div>
  <div id="lockTip"></div>
</div>

<script>
  const grid = document.getElementById('grid');
  document.getElementById('logoIco').innerHTML = window.ORANGE_ICONS.orange;

  // 灰气泡点击说明：2.2秒后自己消失（不用弹窗——控制台是无边框玻璃窗，弹窗会抢焦点）
  let lockTipTimer = null;
  function showLockTip(msg) {
    const el = document.getElementById('lockTip');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(lockTipTimer);
    lockTipTimer = setTimeout(() => el.classList.remove('on'), 2200);
  }

  // ---------- 收起控制台：只是隐藏面板，软件继续后台运行（右键小球可再次打开） ----------
  document.getElementById('btnClose').addEventListener('click', () => {
    window.orange.closeSelf();
  });

  // ---------- 气泡网格 + 拖出逻辑 ----------
  // 点击=原地打开卡片；拖动超过阈值=卡片跟手拖出，松手落位
  (async () => {
    const mods = (await window.orange.getModules()).filter((m) => !m.hidden);
    const bubbleById = {};
    // 气泡手势=单例状态+一套全局监听（坑57）：原先每气泡各挂一份window级mousemove/mouseup
    // 闭包，锁定模式下热区翻穿透会吞掉mouseup→那个气泡的pressed搁浅为true→之后点任意气泡，
    // 全体mouseup监听齐响，搁浅的旧气泡跟着补发动作（实测症状：点卡牌气泡却切换了锁定）。
    // 单例状态下新mousedown天然顶掉搁浅旧态，搁浅无从发生。
    let gest = null;   // { id, sx, sy, draggedOut }
    mods.forEach((m) => {
      const el = document.createElement('div');
      el.className = 'bubble lg-tile' + (m.locked ? ' locked' : (m.ready ? '' : ' stub'));
      bubbleById[m.id] = el;
      const icoSvg = (window.ORANGE_ICONS && window.ORANGE_ICONS[m.id]) || m.icon;
      el.innerHTML = '<div class="ico">' + icoSvg + '</div><div class="lab">' + m.label + '</div>'
        + (m.locked ? '<div class="badge">学员特供</div>' : (m.ready ? '' : '<div class="badge">开发中</div>'));
      // 学员特供占位：永久置灰，按下不产生手势（不开卡、不拖出）；主进程模块表里也没有它，喊开也开不出。
      // 点它给一句人话——不说清的话学员会以为软件坏了（0915：正是"点了没反应"类反馈的一半来源）
      if (m.locked) {
        el.title = '学员特供：此功能仅完整版提供';
        el.addEventListener('mousedown', () => showLockTip('「' + m.label + '」是完整版功能，学员特供版没有这块'));
        grid.appendChild(el);
        return;
      }

      el.addEventListener('mousedown', (e) => {
        gest = { id: m.id, sx: e.screenX, sy: e.screenY, draggedOut: false };
      });
      if (m.id === 'lock') el.title = '点击：打开/收回锁定卡片（在卡片里点锁头开关锁定）';
      if (m.id === 'batchall') el.title = '批处理卡：卡上开关点亮后，点「生成」=顺序跑遍PS里每张打开的图（有选区跑选区，无选区跑全图，结果各回各图）';

      grid.appendChild(el);
    });

    window.addEventListener('mousemove', (e) => {
      if (!gest) return;
      if (!gest.draggedOut) {
        if (Math.abs(e.screenX - gest.sx) + Math.abs(e.screenY - gest.sy) > 12) {
          gest.draggedOut = true;
          window.orange.bubbleDragStart(gest.id, e.screenX, e.screenY);
        }
      } else {
        window.orange.bubbleDragMove(e.screenX, e.screenY);
      }
    });
    window.addEventListener('mouseup', () => {
      if (!gest) return;
      if (gest.draggedOut) window.orange.bubbleDragEnd();
      // 锁定气泡=普通卡牌开关（用户裁定0903）：点击开/收锁定卡片，锁定开关在卡片里点锁头
      else window.orange.openCard(gest.id);   // 纯点击=打开（恢复到上次位置）
      gest = null;
    });
    // 窗口失焦=手势作废（穿透翻转吞mouseup的兜底：绝不让按压状态过夜）
    window.addEventListener('blur', () => {
      if (gest && gest.draggedOut) window.orange.bubbleDragEnd();
      gest = null;
    });

    // 打开状态点亮：初始化拉一次 + 订阅广播（锁定气泡同款：点亮=锁定卡片开着）
    function applyStates(st) {
      for (const id in bubbleById) {
        bubbleById[id].classList.toggle('open', !!st[id]);
      }
    }
    window.orange.getCardStates().then(applyStates);
    if (window.orange.onCardStates) window.orange.onCardStates(applyStates);
    // 批处理气泡状态灯：跟随批处理开关
    function applyBatchBubble(on) {
      if (bubbleById.batchall) bubbleById.batchall.classList.toggle('batch-live', !!on);
    }
    window.orange.getConfig().then((c) => applyBatchBubble(c.gen && c.gen.batchAll === '1'));
    if (window.orange.onGenVars) window.orange.onGenVars((g) => { if (g) applyBatchBubble(g.batchAll === '1'); });
  })();
</script>
<script src="glass.js"></script>
</body>
</html>
