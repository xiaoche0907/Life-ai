<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #panel {
    position: absolute; inset: 12px;
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--text);
  }
  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
    cursor: grab;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #fff; }
  #head .sp { flex: 1; }
  .hbtn {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer;
    background: var(--btn-bg);
  }
  .hbtn:hover { background: var(--btn-bg-hover); }

  #body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 4px 14px 12px;
  }
  /* 开关独占剩余空间正中（0903用户裁定：滑块居中）——提示文字固定卡底，换行不再把开关顶偏 */
  #swWrap {
    flex: 1; min-height: 0; align-self: stretch;
    display: flex; align-items: center; justify-content: center;
  }

  /* 苹果式大开关：随卡等比缩放（0908用户裁定"缩放手感差/费解"——之前用 --zi 反缩放让它视觉恒定74x42，
     卡缩到 0.45 时它占掉 .lg 内容区 120x71 的大半，标题+提示挤不下被 overflow:hidden 裁掉=看着像"缩了但没缩"） */
  .sw {
    position: relative; flex: none;
    width: 74px; height: 42px;
    border-radius: 21px;
    background: rgba(255,255,255,0.16);
    cursor: pointer;
    transition: background 0.22s, box-shadow 0.3s;
  }
  .sw::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    transition: left 0.22s cubic-bezier(0.34, 1.3, 0.64, 1);
  }
  /* 激活一律锁定红色警示光（0903用户裁定）：批模式一开生成就连跑N张扣费，红=危险信号 */
  .sw.on { background: #ff3b30; }
  .sw.on::after { left: 35px; }
  /* 激活：开关本体最醒目呼吸强光 */
  .sw.on { animation: swGlow 1.1s ease-in-out infinite; }
  @keyframes swGlow {
    0%, 100% { box-shadow: 0 0 6px 1px rgba(255, 59, 48, 0.9); }
    50% { box-shadow: 0 0 22px 6px rgba(255, 59, 48, 0.95); }
  }

  /* 激活的卡牌边框红色爆闪环=theme.css共用.warnring（批处理/抗截断/参考图三卡同款） */
</style>
</head>
<body>
<div id="panel" class="lg">
  <div id="head">
    <span class="title" style="display:flex;align-items:center;gap:6px"><span id="titleIco" style="display:flex;width:13px;height:13px;color:var(--accent-text)"></span>批处理</span>
    <div class="sp"></div>
  </div>
  <div id="body">
    <div id="swWrap">
      <span class="sw" id="swBatch" data-pass title="点亮后：点「生成」= 顺序跑遍PS里每张打开的图"></span>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="glass.js"></script>
<script>
  const sw = document.getElementById('swBatch');
  document.getElementById('titleIco').innerHTML = window.ORANGE_ICONS.batchall;
  let on = false;

  // 激活=开关+卡片边框红色爆闪（最醒目——批模式误触会连跑N张图扣费，必须一眼看见）
  // 状态注解文字已移除（0903用户裁定）：状态只靠开关位置+红光表达
  function updateUI(isOn) {
    on = !!isOn;
    sw.classList.toggle('on', on);
    const lg = document.querySelector('.lg');
    let ring = lg.querySelector(':scope > .warnring');
    if (on && !ring) {
      ring = document.createElement('div');
      ring.className = 'glowring warnring';   // 不挂loop：warnRing自带更亮的爆闪节奏
      lg.appendChild(ring);
    } else if (!on && ring) {
      ring.remove();
    }
  }

  sw.addEventListener('click', async () => {
    await window.orange.setConfig({ gen: { batchAll: on ? '0' : '1' } });
    const cfg = await window.orange.getConfig();
    updateUI(cfg.gen && cfg.gen.batchAll === '1');
  });

  window.orange.getConfig().then((c) => updateUI(c.gen && c.gen.batchAll === '1'));
  if (window.orange.onGenVars) window.orange.onGenVars((g) => { if (g) updateUI(g.batchAll === '1'); });
</script>
</body>
</html>
