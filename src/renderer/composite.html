<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #card {
    position: absolute; inset: 12px;
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--text);
  }
  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    cursor: grab;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: #fff; }
  #head .title svg { width: 16px; height: 16px; color: var(--accent-text); }
  #head .sp { flex: 1; }
  .hbtn {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer;
    background: var(--btn-bg);
  }
  .hbtn:hover { background: var(--btn-bg-hover); }

  #body { flex: 1; overflow-y: auto; padding: 2px 16px 12px; display: flex; flex-direction: column; gap: 13px; }
  #body::-webkit-scrollbar { width: 0; }

  .row .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .row label { font-size: 11.5px; color: #fff; font-weight: 600; }
  .row .num { font-size: 11.5px; color: var(--accent-text); font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 20px; accent-color: var(--accent); cursor: pointer; }

  /* 滑块开关（老插件同款交互） */
  .switch {
    position: relative; width: 38px; height: 20px; flex: none;
    border-radius: 10px; cursor: pointer;
    background: var(--btn-bg); border: 1px solid var(--inset-border);
    transition: background 0.18s;
  }
  .switch .knob {
    position: absolute; top: 1px; left: 1px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #ccc; transition: left 0.18s, background 0.18s;
  }
  .switch.on { background: var(--accent); }
  .switch.on .knob { left: 19px; background: #fff; }

  textarea {
    width: 100%; height: 160px; min-height: 40px; max-height: 400px; resize: vertical;   /* 0908 用户要求：植入物体框加长到原 64 的 2.5 倍 */
    border: 1px solid var(--inset-border); border-radius: 10px;
    background: var(--inset-bg); color: var(--text);
    font-size: 11.5px; line-height: 1.5; padding: 7px 10px;
    outline: none; user-select: text;
  }
  textarea:focus { border-color: var(--accent-border); }

  /* IP智能生成行：输入框+✨按钮 */
  #ipRow { display: flex; gap: 7px; }
  #ipName {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px;
    border: 1px solid var(--inset-border); border-radius: 10px;
    background: var(--inset-bg); color: var(--text);
    font-size: 11.5px; outline: none; user-select: text;
  }
  #ipName:focus { border-color: var(--accent-border); }
  #btnIpGen {
    flex: none; height: 32px; padding: 0 13px;
    border: 1px solid var(--accent-border); border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-text);
    font-size: 11.5px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  #btnIpGen:hover { filter: brightness(1.2); }
  #btnIpGen.busy { opacity: 0.5; cursor: default; }
  #ipStat { font-size: 10px; color: var(--text-dim); min-height: 12px; margin-top: 4px; }
  #ipStat.err { color: #ff9a9a; }
  #ipStat.ok { color: var(--ok); }
</style>
</head>
<body data-arm-id="composite">
<script src="icons.js"></script>
<div id="card" class="lg">
  <div id="head">
    <span class="title"><span id="ico"></span>半合成 · 物体植入</span>
    <div class="sp"></div>
  </div>
  <div id="body">
    <div class="row">
      <div class="hd"><label title="0=极简点缀 · 0.5=前中景均衡 · 1.0=高密度铺满">植入密度</label><span class="num" id="denNum">0.75</span></div>
      <input type="range" id="density" min="0" max="1" step="0.05" value="0.75" title="0=极简点缀 · 0.5=前中景均衡 · 1.0=高密度铺满" />
    </div>
    <div class="row" id="rowRelight">
      <div class="hd"><label title="开=为植入物体补自洽受光与接地阴影 · 关=保持原光照完全不变">光源替换</label><span class="switch" id="relight" title="开=为植入物体补自洽受光与接地阴影 · 关=保持原光照完全不变"><span class="knob"></span></span></div>
    </div>
    <div class="row">
      <div class="hd"><label title="三层景深模板：前景大虚化/身边同焦锐利/身后融入背景虚化，原图逐像素冻结；画面比例自动跟随生图模式的比例设置">白棚模式（三层景深植入）</label><span class="switch" id="studio" title="开=按三层景深模板跑 · 关=普通物体植入"><span class="knob"></span></span></div>
    </div>
    <div class="row">
      <div class="hd"><label title="关=全身人像（物体沿站位一圈、可接地脚边）· 开=半身人像（物体集中躯干两侧肩线附近、虚化差拉大）">半身取景（关=全身）</label><span class="switch" id="half" title="影响AI生成语料和白棚模板的物体摆位与虚化策略"><span class="knob"></span></span></div>
    </div>
    <div class="row" id="rowIp">
      <div class="hd"><label title="输入角色名/IP（如'2B 尼尔机械纪元'），AI自动生成配套的植入物体清单填到下面">角色 IP 智能生成</label></div>
      <div id="ipRow">
        <input id="ipName" placeholder="角色名 + IP，如：2B 尼尔机械纪元" />
        <button id="btnIpGen" title="用AI对话配置的模型生成植入物清单">✨ 生成</button>
      </div>
      <div id="ipStat"></div>
    </div>
    <div class="row" id="rowObj">
      <div class="hd"><label>植入物体</label></div>
      <textarea id="obj" placeholder="要植入的物体清单…"></textarea>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  $('ico').innerHTML = window.ORANGE_ICONS.composite;

  const DEF_OBJECT = '燃烧的坦克残骸、沙袋掩体、蛇腹铁丝网、散落弹壳与弹链、倒塌砖墙残块、升腾硝烟与火星';

  // ---------- 半合成·物体植入万能模板（老插件原版移植） ----------
  const TPL = `{
  "scene_type": "半合成·物体自定义植入万能模板（非换背景·非换脸·非风格化重调色·非扩图）",
  "植入物体": "__OBJECT__",
  "@param:植入密度": __DENSITY__,
  "@param:植入密度_label": "植入密度",
  "@param:光源替换": __RELIGHT__,
  "@param:光源替换_label": "光源替换(0=关闭/1=开启)",
  "scene_color_lock": "最高硬约束:严禁改变原场景的 HSL、明度(Luminance/Brightness)、对比度(Contrast)、伽马(Gamma)——全局色彩与影调逐像素保持与原图一致,不做任何风格化重调色。",
  "system_role": "你是一位资深数字合成总监 + VFX 环境美术,精通半合成(Semi-Composite)、PBR 物理材质与透视重投影。唯一任务:在【严禁替换/更改背景】且【严禁改变原场景 HSL/明度/对比度/伽马】的前提下,按【植入物体】字段向画面前景+中景植入物体并清理拍摄器材与路人。不做:换背景/换脸/改装束/风格化重调色/扩图。",
  "input_contract": {
    "image_1": "主体图:提供人物身份、姿态、构图、原始光照与背景(背景须100%保留)。",
    "image_2": "可选参考图:仅作【植入物体】的款式/材质参考;未提供则按文字生成。严禁迁移其颜色/光源/背景/身份。"
  },
  "global_locks": {
    "resolution": "高分辨率,不低于原图;原图<4K则以原图为上限,严禁拉伸放大。",
    "preserve_identity": true, "preserve_face": true, "preserve_body_pose": true,
    "preserve_costume_design": "严禁改人物装束/加装备(除非植入物体明确要求穿戴)。",
    "preserve_composition": true, "preserve_perspective_system": true,
    "preserve_background": "最高硬约束。背景几何/墙体/远景天际线/远景地形不得替换/重绘/搬移。非操作区逐像素=image_1。",
    "preserve_scene_color": "最高硬约束。原场景 HSL/明度/对比度/伽马逐像素不变。"
  },
  "operation_mode": {
    "base_mode": "additive_only + preserve_background + preserve_scene_color",
    "whitelisted_exceptions": [
      "cleanup: 允许移除拍摄器材与路人,补全=原背景延续。",
      "ground_overlay: 允许在前景+中景顺透视叠加地表层,远景背景地面不得替换。",
      "relight_for_inserted_only: 仅当【@param:光源替换】=1时,才允许依据画面已有光源的方向/色温,为【新增植入物体】生成自洽的受光与接地阴影;严禁改变原场景全局HSL/明度/对比度/伽马、严禁替换背景、严禁改变人物原有受光。当=0时完全不调整任何光照。"
    ]
  },
  "detection_identify": {
    "perspective": "识别一/两/三点透视、消失点、地平线、相机倾角、焦段、景深虚化,确立X/Y/Z三维基准轴。",
    "light_audit": "识别画面现有光源的方向/色温/强度/阴影,供新增植入物体的受光匹配(不改变原光照本身)。",
    "intrusion_scan": "扫描拍摄器材(灯架/三脚架/柔光箱/反光板/相机/线缆)与路人。",
    "scale_anchor": "以角色脖子宽度为全画面唯一绝对参照(成人颈宽约12-14cm = 1 NeckWidth)。"
  },
  "operation_modules": {
    "module_1_cleanup": "移除拍摄器材、路人,以原背景材质/光照/噪点/锐度无缝补全,严禁补成新内容。",
    "module_2_ground_layer": "前景+中景顺透视叠加地表层(PBR+Wetmap+草叶SSS+Displacement),近大远小贴合消失点;仅叠加不替换原地面,远景背景不动;严禁改变原场景整体影调。",
    "module_3_object_insertion": "按植入物体清单 additive_only 植入;数量层次由植入密度控制;全部以NeckWidth倍数定尺;物体仅置于人物周围环境,严禁置入人物手中/身上(除非明确要求穿戴);依画面已有氛围生成合理大气介质,远景遵循大气透视衰减。",
    "light_source_replacement": "受【@param:光源替换】开关控制:=0时新增物体仅按原场景已有光照方向被动受光,不做任何光照调整;=1时可为新增物体生成更明确的受光/接地阴影/AO,使其与画面融合,但严禁改变原场景HSL/明度/对比度/伽马、严禁替换背景、严禁人物身份/肤色漂移、严禁改装束。"
  },
  "spatial_reference": {
    "anchor": "1 NeckWidth = 角色脖子宽度(约12-14cm),全画面唯一绝对参照单位",
    "rule": "所有植入物尺寸/间距/扩散范围以NeckWidth倍数声明,严禁无参照绝对数值,随景深透视近大远小换算。"
  },
  "constraints_triad": {
    "composition_coherence": "植入物透视引导线汇聚至原图同一消失点;垂直轴与相机倾角同步;按景深匹配虚化/锐度;接地产生符合画面主光方向的接地阴影与AO;严禁悬浮/穿模/贴图感。",
    "color_pipeline_lock": "锁定全局HSL/Gamma/对比/明度/白平衡/色调曲线/调色,逐像素与原图一致;新增物体本身的固有色按其材质生成,但不得反向改写原场景任何全局影调。",
    "material_quality_lock": "UE5 Lumen/Path Tracing影视级;Nanite高模自然倒角;PBR(BaseColor/Roughness/Metalness/Normal/Displacement/AO);灰尘划痕锈蚀磨损湿渍;对标Quixel Megascans/ILM/Weta;严禁卡通塑料/扁平贴图/玩具质感/2D贴画。"
  },
  "cinematic_look_lock": {
    "lens": "以原图实际焦段为准;植入物虚化严格匹配其景深位置的原图CoC",
    "grain": "胶片颗粒须与原图噪点统一",
    "note": "不套用任何改变原场景整体色调/明暗的滤镜,仅保证新增物体材质质感达影视级。"
  },
  "behavior_植入密度": {
    "0.0": "仅1-2件远景小物点缀,大量留白",
    "0.3-0.6": "前中景均衡布置,自然散落有层次",
    "0.85-1.0": "高密度铺满前中景,强叙事压迫感",
    "physics": "密度提升只增加数量/层次,严禁改变NeckWidth尺寸基准、严禁遮挡人物面部、严禁蔓延到背景做替换"
  },
  "behavior_光源替换": {
    "0": "关闭:完全不调整任何光照,新增物体仅按原场景光照被动受光",
    "1": "开启:为新增物体补自洽受光/接地阴影/AO,使其与画面融合;但仍严禁改变原场景HSL/明度/对比度/伽马、严禁动背景、严禁人物身份/肤色漂移、严禁改装束"
  },
  "execution_order": [
    "1. 读取image_1,识别透视/焦段/焦点/景深/倾角/构图 + 现有光源方向 + 测量NeckWidth锚点。",
    "2. 解析植入物体清单。",
    "3. 检测到拍摄器材/路人 → 移除并以原背景补全。",
    "4. 前景+中景顺透视植入地表层(仅叠加不替换原地面,远景背景不动)。",
    "5. 按植入密度与景深层级植入植入物体,全部NeckWidth定尺、共享消失点,物体置于人物周围环境。",
    "6. 若【@param:光源替换】=1,仅为新增物体补受光/接地阴影使其融合(不动原场景影调);=0则跳过。",
    "7. 最终融合校验:确认背景零改动、原场景HSL/明度/对比度/伽马零改动、无贴图感、人物身份与装束一致。"
  ],
  "global_red_lines": [
    "严禁替换/重绘/搬移/抬升/铲平背景及远景地形——只准前景+中景叠加植入。",
    "严禁改变原场景 HSL/明度/对比度/伽马,严禁任何风格化重调色。",
    "严禁换脸/换身份/改体型/改构图/改人物装束(除非植入物体明确要求穿戴)。",
    "严禁植入物引入与原图冲突的第二套透视/消失点,严禁悬浮与贴图感。",
    "严禁使用无NeckWidth参照的绝对尺寸。",
    "严禁出现卡通塑料/扁平贴图/AI糊弄材质。",
    "严禁扩图/裁切/旋转/镜像/改变画布尺寸。"
  ]
}`;

  // ---------- 白棚模式：人像三层景深植入模板（紧凑单字段版，全身/半身参数化） ----------
  // 白棚开关=纯激活；清单整段注入，物品自带方位词归层，身边层为绝对主力；
  // 取景由全身/半身开关注入；画面比例联动生图模式；密度共用滑块。全模板<8000字符
  const TPL_STUDIO = `{
  "task": "__FRAMING__·物体植入·三层景深（UE5建模质感）——原图逐像素冻结，前/中/后三层分别匹配虚化",
  "画面比例": "__RATIO__",
  "取景": "__FRAMING__",
  "植入物体": "__OBJECT__",
  "@param:植入密度": __DENSITY__,
  "@param:植入密度_label": "植入密度",
  "@param:光源替换": __RELIGHT__,
  "@param:光源替换_label": "光源替换(0=关/1=开)",
  "system_role": "你是资深数字合成总监+VFX环境美术，专精人像的三维资产合成。工作方式=纯图层叠加：原图是被彻底锁死的底层图层，新物体只画在它上/下的新图层；每件物体先想清楚它在哪一层深度，再严格按该层该有的虚化程度渲染。",
  "红线1_原图冻结": "凌驾一切条款：原图像素只能被新物体遮挡，不能被替换/重绘/重新虚化/美化。唯一允许变化的像素=①被新增前中景物体遮挡处②新增后景物体占据且未被人物遮挡处。验收：未被新物体覆盖的区域RGB与原图逐像素完全一致。严禁把原图当参考重新画一遍，严禁重新生成人物或背景，原背景的朦胧散景是必须逐像素保留的内容。",
  "红线2_三层机制": {
    "归层": "清单每件物品按方位词（身前/身边/身后）归入对应层；未标方位的按构图合理归层；某层无物则该层失活；清单为空=原图原样输出零改动。",
    "⚠️分布重心": "以【身边层】为绝对主力——六成以上物体必须放在人物身边同焦平面区域，身前/身后只做少量点缀。严禁把大量物体丢进前景或背景导致人物周围空洞。",
    "L1身前": "焦平面之前、近镜头。必须大幅虚化成朦胧色块：细节/纹理/边缘全部消失，虚化明显强于原背景；只占画面边缘四角与下缘，常有一部分被画框裁切；严禁横跨面部、严禁在画面正中遮挡、严禁清晰锐利——前景越糊越真。画在最上层遮挡一切。",

  // ---------- 参数持久化（存 config.gen.sc* 字段） ----------
  function bind() {
    const den = $('density');
    den.addEventListener('input', () => {
      $('denNum').textContent = den.value;
      window.orange.setConfig({ gen: { scDen: den.value } });
    });
    den.addEventListener('wheel', (e) => {
      e.preventDefault();
      den.value = Math.min(1, Math.max(0, Number(den.value) + (e.deltaY > 0 ? -0.05 : 0.05))).toFixed(2);
      $('denNum').textContent = den.value;
      window.orange.setConfig({ gen: { scDen: den.value } });
    });

    const sw = $('relight');
    sw.addEventListener('click', () => {
      const on = sw.classList.toggle('on');
      window.orange.setConfig({ gen: { scRel: on ? '1' : '0' } });
    });

    // 白棚模式开关=纯激活：开=跑三层景深模板（界面不展开副字段，清单/问AI/密度照常用），
    // 关=普通物体植入。光源替换只属于普通模板，白棚时隐藏
    const swSt = $('studio');
    swSt.addEventListener('click', () => {
      const on = swSt.classList.toggle('on');
      window.orange.setConfig({ gen: { scStudio: on ? '1' : '0' } });
    });

    // 全身/半身取景开关（默认关=全身）：影响AI生成语料 + 白棚模板的摆位与虚化策略
    $('half').addEventListener('click', () => {
      const on = $('half').classList.toggle('on');
      window.orange.setConfig({ gen: { scHalf: on ? '1' : '0' } });
    });

    $('obj').addEventListener('change', () => {
      window.orange.setConfig({ gen: { scObj: $('obj').value } });
    });

    // ---------- 角色IP智能生成：AI（沿用AI对话的渠道/模型配置）按IP生成植入物清单→填入植入物体框 ----------
    const btnGen = $('btnIpGen');
    function ipStat(t, cls) { const s = $('ipStat'); s.className = cls || ''; s.textContent = t || ''; }
    async function ipGenerate() {
      if (btnGen.classList.contains('busy')) return;
      const ip = $('ipName').value.trim();
      if (!ip) { ipStat('先输入角色名/IP', 'err'); setTimeout(() => ipStat(''), 2000); return; }
      btnGen.classList.add('busy');
      btnGen.textContent = '生成中…';

      // 有PS选区（或全图开关兜底）就把画面一起喂给模型：按实际构图定制清单与摆位
      let img = null;
      try {
        ipStat('正在抓取PS画面…');
        const cap = await window.orange.psExec('captureInput', { fullIfNoSel: true }, 20000);
        if (cap && cap.ok && cap.result && cap.result.image) img = cap.result.image;
      } catch (e) {}

      const studioOn = $('studio').classList.contains('on');
      const halfOn = $('half').classList.contains('on');
      const frameWord = halfOn ? '半身人像' : '全身人像';
      ipStat((img ? 'AI正在分析画面构图并为「' + ip + '」构思' : 'AI正在为「' + ip + '」构思')
        + (studioOn ? '三层景深植入方案…' : '植入物清单…') + (img ? '' : '（PS未连接，纯文字模式）'));
      try {
        // 主题锚定（治"跑题物体"）：先定该IP的一个具体场景主题，清单开头输出主题，全部物件必须属于它
        const THEME_RULE = '第一步：先为该角色选定一个最具代表性的【具体场景主题】（如：废弃战场/教会圣殿/樱花庭院——必须来自该IP的世界观）。'
          + '清单第一项固定输出「主题：××」，其后所有物件必须严格属于这个主题场景，风格材质年代彼此统一，'
          + '严禁混入与主题无关的物件（例：科幻IP不出现古典烛台、和风IP不出现欧式雕塑）。\n';
        const FRAME_RULE = halfOn
          ? '取景为半身人像：物件全部紧贴人物周围——大部分标「身边的」（躯干两侧与肩线附近、与人物同焦清晰），少量标「身前的」（只占画面边角、大幅虚化）和「身后的」（融入背景虚化的离散小物）。⚠️半身空间有限，只出4-6件，宁少勿挤——物件是给人物作陪衬的，不许多到需要压缩人物。\n'
          : '取景为全身人像：物件以人物站位一圈为主——大部分标「身边的」（躯干两侧及腰胯至脚边的接地物件，必须能自然落地），少量标「身前的」（画面下缘边角近地处）和「身后的」（背景里的离散物件）。物件高度不超过人物肩线（远处剪影除外）。\n';
        let ask;
        if (halfOn) {
          // 半身模式：结构化输出（主题/身前/身边/身后标签），落框后跑图时自动拆进五填空模板
          ask = '你是资深影视场景美术，专精浅景深半身人像的三维资产合成（前景大虚化/身边同焦锐利/身后融背景虚化）。\n'
            + '角色/IP：' + ip + '\n'
            + (img ? '附图是当前要处理的半身人像。先分析：人物位置与占幅、脸部区域、留白、背景虚化程度与色调。\n' : '')
            + '第一步：为该角色选定一个最具代表性的【具体场景主题】（必须来自该IP世界观），全部物件严格属于该主题、风格材质年代统一，严禁混入无关物件。\n'
            + '然后按三层分配物件（半身空间有限，宁少勿挤——物件是陪衬，总量4-6件）：\n'
            + '身前=1-2件大幅虚化的剪影级物件（只在画面边缘下缘）；身边=2-3件与人物同焦平面的清晰道具（躯干两侧肩线附近，主力层）；身后=1-2件融入背景虚化的离散小物。\n'
            + '铁律：人物占幅比例位置大小绝不改变、人物是绝对视觉中心、严禁遮脸；身后只能是离散物件不是场景。\n'
            + '要求：严格按此格式输出一行（分号分隔四段，段内物件用顿号）：\n'
            + '主题：××；身前：物件+修饰词；身边：物件+修饰词、物件+修饰词；身后：物件+修饰词\n'
            + '不要编号、不要解释、不要引号、不要输出任何其他文字。';
        } else if (studioOn) {
          // 白棚语境：三层景深——身边层为主力（治"虚化不对/物体太散"）
          ask = '你是资深影视场景美术，精通浅景深' + frameWord + '的三维资产合成。用户在做"' + frameWord + '三层景深物体植入"：'
            + '前景（身前）大幅虚化只占画面边角、中景（身边）与人物同焦平面全清晰、后景（身后）融入原背景虚化且被人物遮挡。\n'
            + '角色/IP：' + ip + '\n'
            + (img ? '附图是当前要处理的' + frameWord + '。请先分析：人物位置与占幅、脸部所在区域、画面留白、背景虚化程度与色调氛围。\n' : '')
            + THEME_RULE + FRAME_RULE
            + '给出' + (halfOn ? '4-6' : '6-9') + '件与主题场景强绑定的标志性植入物（道具/残骸/环境元素等可落地实体，不要人物本体、不要发光特效），'
            + '每件物品以方位词开头（身前的/身边的/身后的）+物品名+一两个材质状态修饰词；'
            + '⚠️至少六成物件标「身边的」——物体要集中在人物周围衬托人物，不许散到远处'
            + (img ? '；方位选择贴合附图的留白与构图' : '') + '。\n'
            + '铁律：人物比例位置大小保持不变、人物是绝对视觉中心；身前物严禁遮脸；身后物必须是离散物件不是场景。\n'
            + '要求：只输出一行清单，「主题：××」开头，物件之间用中文顿号"、"分隔，不要编号、不要解释、不要引号。';
        } else {
          ask = '你是资深影视场景美术。用户在做"半合成物体植入"修图：把与某角色/IP强相关的标志性物品植入到' + frameWord + '照片的前中景里。\n'
            + '角色/IP：' + ip + '\n'
            + (img ? '附图是当前要处理的画面。请先分析构图：人物的位置与比例、留白区域、透视方向、光线氛围。\n' : '')
            + THEME_RULE + FRAME_RULE
            + '给出6-9件与主题场景强绑定的标志性植入物（武器/道具/残骸/环境元素等可落地实体，不要人物本体、不要抽象概念），'
            + '每件=方位词+物品名+材质/状态修饰词' + (img ? '，摆位优先填充附图留白处' : '') + '。\n'
            + '铁律：人物在画面中的比例、位置、大小必须保持不变，人物始终是视觉中心——植入物只能环绕衬托，严禁遮挡人物主体、严禁抢占视觉焦点。\n'
            + '要求：只输出一行清单，「主题：××」开头，物件之间用中文顿号"、"分隔，末尾追加"人物比例位置大小保持不变，人物为绝对视觉中心，植入物不遮挡人物"。不要编号、不要解释、不要引号。';
        }
        const r = await window.orange.chatAsk(ask, img);
        if (r.ok && r.text) {
          // 清洗：去掉可能的换行/多余说明，只留第一段实体清单
          const line = r.text.split('\n').map((s2) => s2.trim()).filter(Boolean)[0] || r.text.trim();
          $('obj').value = line;
          window.orange.setConfig({ gen: { scObj: line, scIp: ip } });
          ipStat(img ? '✓ 已按画面构图生成摆放方案并填入（可手动微调）' : '✓ 已生成并填入（可手动微调）', 'ok');
          setTimeout(() => ipStat(''), 4000);
        } else {
          ipStat('✗ ' + (r.error || '生成失败'), 'err');
        }
      } catch (e) {
        ipStat('✗ ' + (e.message || String(e)), 'err');
      } finally {
        btnGen.classList.remove('busy');
        btnGen.textContent = '✨ 生成';
      }
    }
    btnGen.addEventListener('click', ipGenerate);
    $('ipName').addEventListener('keydown', (e) => { if (e.key === 'Enter') ipGenerate(); });
    $('ipName').addEventListener('change', () => window.orange.setConfig({ gen: { scIp: $('ipName').value } }));
  }

  // ---------- 生成负载：总控▶生成时向本卡收取（模板替换占位） ----------
  function jsesc(s) { return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' '); }

  // 半身模式：从植入物体框解析「主题/身前/身边/身后」标签拆进五填空模板；
  // 手写无标签的内容=整段当身边层（物体紧贴人物的最安全解释）
  function parseHalfBox(text) {
    const t = (text || '').trim();
    const grab = (names) => {
      const m = t.match(new RegExp('(?:' + names + ')[：:]\\s*([^；;\\n]+)'));
      return m ? m[1].trim() : '';
    };
    const out = {
      theme: grab('主题|布景主题'),
      l1: grab('身前|人物身前'),
      l2: grab('身边|人物身边'),
      l3: grab('身后|人物身后'),
    };
    if (!out.theme && !out.l1 && !out.l2 && !out.l3) out.l2 = t;
    return out;
  }

  window.__getGenPayload = async () => {
    const cfg = await window.orange.getConfig();
    const g = cfg.gen || {};
    let prompt;
    if ($('half').classList.contains('on')) {
      // 半身模式最高优先（用户裁定）：无论白棚与否，一律走原版五填空三层景深模板（坐标锁最重，治缩人）
      const ratioTxt = (!g.ratio || g.ratio === 'Auto') ? '与原图完全一致，不做任何改变' : g.ratio;
      const p = parseHalfBox($('obj').value.trim());
      prompt = TPL_HALF.replace('__RATIO__', jsesc(ratioTxt))
                       .replace('__THEME__', jsesc(p.theme))
                       .replace('__L1__', jsesc(p.l1))
                       .replace('__L2__', jsesc(p.l2))
                       .replace('__L3__', jsesc(p.l3))
                       .replace('__DENSITY__', $('density').value);
    } else if ($('studio').classList.contains('on')) {
      // 白棚模式（全身）：紧凑三层景深模板（单字段）；比例联动生图模式
      const ratioTxt = (!g.ratio || g.ratio === 'Auto') ? '与原图完全一致，不做任何改变' : g.ratio;
      const obj = $('obj').value.trim() || DEF_OBJECT;
      const half = false;
      const framing = half ? '半身人像' : '全身人像';
      const l2zone = half
        ? '躯干两侧与肩线附近'
        : '人物站位周围一圈——躯干两侧、腰胯至脚边的地面接触区（落地物必须正确接地：接触阴影+透视贴地）';
      const framerules = half
        ? '半身人像：焦平面极薄，三层虚化差必须拉大；身边层集中在躯干两侧与肩线附近；身前物只在画面边角且大幅虚化；一切物体紧贴人物周围布置，不散布远处。⚠️半身画面空间有限：物体总数宁少勿挤，放不下就删物体，人物占幅一个像素都不许缩小。'
        : '全身人像：身边层沿人物站位一圈布置并可延伸到脚边地面，落地物必须正确接地（接触阴影+透视贴地）；身前物置于画面下缘与边角的近地处；物体高度原则上不超过人物肩线（远处背景剪影除外），保证人物全身轮廓完整突出。';
      prompt = TPL_STUDIO.replace(/__FRAMING__/g, framing)
                         .replace('__L2ZONE__', l2zone)
                         .replace('__FRAMERULES__', framerules)
                         .replace('__RATIO__', jsesc(ratioTxt))
                         .replace('__OBJECT__', jsesc(obj))
                         .replace('__DENSITY__', $('density').value)
                         .replace('__RELIGHT__', $('relight').classList.contains('on') ? '1' : '0');
    } else {
      const obj = $('obj').value.trim() || DEF_OBJECT;
      prompt = TPL.replace('__OBJECT__', jsesc(obj))
                  .replace('__DENSITY__', $('density').value)
                  .replace('__RELIGHT__', $('relight').classList.contains('on') ? '1' : '0');
    }
    return {
      prompt, ratio: g.ratio || 'Auto', size: g.size || 'Auto',
      antiMode: g.antiMode || 0, chartOn: !!g.chartOn, refs: g.refs || [],
    };
  };

  // ---------- 初始化 ----------
  (async () => {
    bind();
    const cfg = await window.orange.getConfig();
    const g = cfg.gen || {};
    if (g.scDen != null) { $('density').value = g.scDen; $('denNum').textContent = g.scDen; }
    if (g.scRel === '1') $('relight').classList.add('on');
    $('obj').value = (g.scObj != null && g.scObj !== '') ? g.scObj : DEF_OBJECT;
    if (g.scIp) $('ipName').value = g.scIp;
    // 白棚模式回读（纯激活开关；光源替换在白棚下同样生效不再隐藏）
    if (g.scStudio === '1') $('studio').classList.add('on');
    if (g.scHalf === '1') $('half').classList.add('on');
  })();
</script>
<script src="glass.js"></script>
</body>
