<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #card {
    position: absolute; inset: 12px;
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--text);
  }
  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    cursor: grab;
    flex: 0 1 auto; min-height: 30px; overflow: hidden;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: #fff; }
  #head .title svg { width: 16px; height: 16px; color: var(--accent-text); }
  #head .sp { flex: 1; }
  #stepTag { font-size: 9.5px; color: var(--text-dim); white-space: nowrap; }

  /* 响应式：wrap撑满卡片，控件区锚定底部跟随拉伸 */
  #wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 14px; display: flex; flex-direction: column; gap: 9px; }
  #wrap::-webkit-scrollbar { width: 0; }

  /* 预览台：始终1:1正方形；边长由 fitSquares() 按剩余高度算出（0910：能放下的最大正方形，按钮行永远可见且不留空档） */
  #stage {
    position: relative; flex: 0 0 auto;
    width: 100%; margin: auto auto 0; aspect-ratio: 1 / 1;
    border-radius: 12px; overflow: hidden;
    background: var(--inset-bg); border: 1px solid var(--inset-border);
    display: flex; align-items: center; justify-content: center;
  }
  #cv { max-width: 100%; max-height: 100%; display: block; }
  #stageHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-dim); text-align: center; line-height: 1.8; pointer-events: none; }

  /* 光盘+右列：固定区域，不滚动；margin-bottom:auto 与方台的 margin-top:auto 配对=整块垂直居中；
     整组水平居中（宽卡时不再缩在左下角，与居中的方台对齐），右列宽度封顶=6 个按钮的自然宽度 */
  #padRow { display: flex; gap: 12px; align-items: center; justify-content: center; flex: none; margin-top: 0; margin-bottom: auto; }
  #pad {
    width: 112px; height: 112px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 34%, var(--btn-bg-hover), var(--inset-bg) 72%);
    border: 1px solid var(--inset-border);
    position: relative; cursor: crosshair;
    touch-action: none;
  }
  #pad::before, #pad::after {
    content: ''; position: absolute; background: var(--inset-border); pointer-events: none;
  }
  #pad::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
  #pad::after { top: 50%; left: 8%; right: 8%; height: 1px; }
  #puck {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    transform: translate(-50%, -50%); pointer-events: none;
    left: 50%; top: 50%;
  }
  /* 轨道摆灯gizmo（机位选择器式）：图片立板+球坐标轨道环+发光灯球 */
  /* 方台在上、控件行在下，整体在剩余高度里垂直居中（首尾 auto 边距=滚动安全的居中法；方台宽度受限时不再一头堆空档） */
  #gzwrap { position: relative; flex: none; display: none; width: 100%; margin: auto auto 0; }
  #gizmo { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 12px; background: var(--inset-bg); border: 1px solid var(--inset-border); cursor: grab; touch-action: none; }
  #gzhint { position: absolute; left: 8px; top: 6px; font-size: 8.5px; color: var(--text-dim); pointer-events: none; }
  #gzread { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; pointer-events: none; }
  #gzread .big { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #gzread .sm { font-size: 8.5px; color: var(--text-dim); }

  #padCol { flex: 0 1 auto; width: 100%; max-width: 424px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  /* 按钮一横排、固定高度、单个封顶 64px（0910）：原来 3 列网格+强制 1:1，卡片一宽就变成 200px 大方块两行放不下 */
  #controlRow { display: flex; gap: 8px; width: 100%; justify-content: center; }
  #controlRow > * { flex: 1 1 0; min-width: 0; width: auto; max-width: 64px; height: 48px; }
  #actionRow { display: flex; gap: 8px; }
  #swCustom {
    width: 52px; height: 52px;
    border: 1px solid var(--accent);
    padding: 0;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all .2s;
  }
  #swCustom:hover {
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 20px rgba(var(--accent-rgb, 25,181,188), 0.3);
  }
  #swCustom::-webkit-color-swatch-wrapper { padding: 8px; }
  #swCustom::-webkit-color-swatch { border: none; border-radius: 6px; }
  .mbtn {
    width: 52px; height: 52px;
    border-radius: 12px;
    cursor: pointer;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--accent);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .mbtn svg {
    width: 24px; height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .mbtn:hover {
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 20px rgba(var(--accent-rgb, 25,181,188), 0.3);
  }
  .mbtn.on {
    background: rgba(var(--accent-rgb, 25,181,188), 0.15);
    box-shadow: 0 0 20px rgba(var(--accent-rgb, 25,181,188), 0.5);
  }

  /* 模式分页：🎚实时打光(数学·免费实时) / ✨AI打光(轨道摆灯·一次一算·能照后方) */
  #modeTabs { flex: none; display: flex; gap: 6px; padding: 0 14px 6px; }
  .mtab { flex: 1; text-align: center; font-size: 11px; padding: 6px 0; border-radius: 9px; background: var(--btn-bg); border: 1px solid var(--inset-border); color: var(--text-dim); cursor: pointer; }
  .mtab.on { color: var(--accent-text); border-color: var(--accent-border); background: var(--accent-soft); }
  .mode-ai #stage { display: none; }
  .mode-ai #pad { display: none; }
  .mode-ai #gzwrap { display: block; }
  .mode-ai .mathonly { display: none !important; }
  #btnAi { display: none; }
  .mode-ai #btnAi { display: flex; }
  #btnUpload { display: none; }
  .mode-ai #btnUpload { display: flex; }
  /* AI模式没有光盘：按钮略放大，右列封顶随之放宽 */
  .mode-ai #padCol { max-width: 460px; }
  .mode-ai #controlRow > * { max-width: 70px; height: 54px; }
  /* 循环切换胶囊：免抢焦点窗口里原生下拉打不开，点击/滚轮循环是全app通用交互 */
  .gp2 {
    display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
    border-radius: 8px; background: var(--inset-bg); border: 1px solid var(--inset-border);
    cursor: pointer; user-select: none; min-width: 0;
  }
  .gp2:hover { border-color: var(--accent-border); }
  .gp2 span { font-size: 9px; color: var(--text-dim); flex: none; }
  .gp2 b { font-size: 10px; color: var(--text); font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1; text-align: right; }
  /* 多张候选条：AI一次生成多张灯光层,点缩略图切换 */
  #aiVars { display: none; gap: 5px; flex-wrap: wrap; flex: none; }
  .mode-ai #aiVars.has { display: flex; }
  #aiVars img { height: 46px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  #aiVars img.on { border-color: var(--accent-text); }

  /* 状态行+底部：固定不滚动 */
  #msg { flex: none; font-size: 9.5px; color: var(--text-dim); padding: 0 14px 12px; min-height: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #msg.err { color: var(--err); }
  .fbig {
    width: 52px; height: 52px;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: rgba(0,0,0,0.3);
    color: var(--accent);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    flex: none;
  }
  .fbig svg {
    width: 24px; height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .fbig:hover {
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 20px rgba(var(--accent-rgb, 25,181,188), 0.3);
  }
  .fbig.acc {
    background: rgba(var(--accent-rgb, 25,181,188), 0.1);
  }
  .fbig.acc:hover {
    background: rgba(var(--accent-rgb, 25,181,188), 0.15);
    box-shadow: 0 0 25px rgba(var(--accent-rgb, 25,181,188), 0.4);
  }
  .fbig:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .fbig:disabled:hover {
    background: rgba(0,0,0,0.3);
    box-shadow: none;
  }
  .fbig.busy { opacity: 0.6; }
</style>
</head>
<body data-arm-id="relight">
<script src="icons.js"></script>
<div id="card" class="lg">
  <div id="head">
    <span class="title"><span id="ico"></span>打光</span>
    <div class="sp"></div>
    <span id="stepTag"></span>
  </div>

  <div id="modeTabs" data-nodrag data-pass data-arm>
    <div class="mtab on" data-mode="math">实时打光</div>
    <div class="mtab" data-mode="ai">AI打光</div>
  </div>

  <div id="wrap">
    <div id="stage" data-nodrag>
      <canvas id="cv"></canvas>
    </div>

    <div id="gzwrap" data-nodrag title="左键拖=灯绕主体走 · 中键拖=灯离主体远近 · 右键拖=转动观察视角 · 滚轮=拉近推远镜头">
      <canvas id="gizmo"></canvas>
      <div id="gzread"></div>
    </div>

    <div id="aiVars" data-nodrag data-pass style="display: none !important;"></div>

    <div id="padRow">
      <div id="pad" data-nodrag data-pass data-arm title="拖动=灯的位置（中心=正上方，拖到边缘=画外侧逆光）· 滚轮=照射大小"><div id="puck"></div></div>
      <div id="padCol">
        <div id="controlRow" data-nodrag data-pass data-arm>
          <input type="color" id="swCustom" value="#ffd2a0" title="点击选光色" />
          <div class="mbtn" id="btnSubject" title="点亮=光只落在人物身上（置入时PS自动识别主体打蒙版，预览不显示）">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="mbtn mathonly" id="btnYflip" title="上下方向反了就点它">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
          </div>
          <div class="mbtn" id="btnReset" title="恢复默认参数">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
          </div>
          <button class="fbig acc mathonly" id="btnGo" data-pass title="识别PS选区，生成法线和深度图">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
          <div class="mbtn" id="btnUpload" data-pass title="识别PS当前选区并载入贴板（AI打光也会自动识别，这个按钮用于手动换选区）">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <button class="fbig acc" id="btnAi" data-pass title="把当前灯位坐标/光色/功率写进提示词，AI直出灰底灯光层——能照亮后方（逆光轮廓/发丝光/透光/背景光晕），一次一算">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
          <button class="fbig acc" id="btnBake" data-pass disabled title="将灯光层置入PS">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div id="msg"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  // 全局错误兜底：任何运行时错误红字显示+落glass日志，绝不无声失灵
  window.onerror = (m2, src, ln) => {
    try {
      const el = document.getElementById('msg');
      if (el) { el.textContent = '内部错误: ' + m2 + ' @' + ln; el.classList.add('err'); }
      if (window.orange && window.orange.glassLog) window.orange.glassLog('[relight] 运行时错误: ' + m2 + ' @' + ln);
    } catch {}
  };
  $('ico').innerHTML = (window.ORANGE_ICONS && window.ORANGE_ICONS.relight) || '';

  // ============================================================
  // 法线图AOV提示词（自研）：AI只输出几何朝向数据图，打光交给本地数学
  // ============================================================
  const NORMAL_PROMPT = `{
  "scene_type": "CGI Camera-Space Normal Map AOV·相机空间法线图通道(几何朝向数据图·非艺术图)",

  "system_role": "你是CGI管线TD，输出VFX标准的相机空间法线AOV。输入图只提供三维几何信息，你输出同一画面的逐像素表面朝向编码图。这不是打光图、不是艺术创作，是几何数据可视化。",

  "⚠️编码规范_SUPREME": {
    "颜色=方向": "每个像素的RGB编码该点表面法线向量(相机空间)：R=法线X分量(128=零,255=正右,0=正左)；G=法线Y分量(128=零,255=正上,0=正下)；B=法线Z分量(128-255,255=正对相机)。",
    "典型外观": "整体紫蓝基调：正对相机的面≈淡紫(128,128,255)；朝右的面偏红粉；朝左偏青蓝；朝上偏黄绿；朝下偏蓝紫——标准游戏/影视法线贴图的经典配色。",
    "背景处理": "无明确几何的背景=平面正对相机=纯色(128,128,255)填充。"
  },

  "⚠️几何对位_SUPREME": {
    "规则": "输出与输入逐像素对齐：同构图、同画幅比例、同镜头，主体轮廓、五官位置、发际边缘、衣褶走向分毫不差。禁止重新取景、放大缩小、平移、改姿态、改画幅。",
    "为什么": "用户将逐像素读取此图做数学光照计算，一个像素的错位都会让光照贴到错误的表面上。"
  },

  "⚠️纯几何无外观_SUPREME": "输出只含朝向信息：无固有色/无纹理/无明暗/无阴影/无高光/无AO/无光照痕迹/无描边/无文字。原图的明暗与颜色只用于推断几何，绝不带入输出。深色头发和浅色皮肤若朝向相同，输出颜色完全相同。",

  "细节层级": "大形体朝向为主(脸颊/鼻梁/下颌/颈肩/躯干/四肢/衣物大褶皱)，中等细节保留(明显衣褶/发束大走向/五官起伏)，微观细节平滑忽略(毛孔/单根发丝/织物编织纹理)——表面连续光滑、渐变过渡、无噪点。",

  "execution_order": [
    "1.解析输入图三维几何(深度/朝向/遮挡)",
    "2.每个表面点计算相机空间单位法线向量",
    "3.按编码规范转换为RGB",
    "4.背景填充(128,128,255)",
    "5.对照输入验证轮廓逐像素对齐",
    "6.执行validation四检，全过才输出"
  ],

  "validation_protocol": {
    "1_对齐检": "把输出叠回原图：轮廓/五官/边缘完全重合吗？有错位=重做。",
    "2_纯度检": "能看出原图的任何固有色/纹理/明暗吗？能=混入外观信息，重做。",
    "3_编码检": "朝右的面偏红、朝上偏绿、正对相机偏蓝紫吗？背景是纯(128,128,255)吗？",
    "4_光滑检": "表面渐变连续、无噪点、无色块断裂吗？"
  },

  "negative_prompts": [
    "无固有色/纹理/明暗/阴影/高光/AO",
    "无重新构图/缩放/平移/姿态改变/画幅改变",
    "无描边/线稿/文字/水印",
    "无艺术化/风格化处理",
    "无噪点/色块断裂/硬边条带",
    "不是深度图、不是艺术插画，是法线数据图"
  ]
}`;

  // ============================================================
  // 深度图AOV提示词（自研）：距离数据图——三维灯位与遮挡投影的地基
  // ============================================================
  const DEPTH_PROMPT = `{
  "scene_type": "CGI Depth Map AOV·相机空间深度图通道(距离数据图·非艺术图)",

  "system_role": "你是CGI管线TD，输出VFX标准的单目深度AOV。输入图只提供三维空间信息，你输出同一画面的逐像素相机距离编码图。这不是黑白照片、不是艺术创作，是距离数据可视化。",

  "⚠️编码规范_SUPREME": {
    "亮度=距离": "纯灰度图：越靠近相机越白、越远越黑。最近的表面≈纯白(245-255)，最远的背景≈深黑(0-25)，中间按真实空间关系连续渐变。",
    "典型外观": "标准MiDaS/ZoeDepth风格深度图：人像=人比背景亮，鼻尖最亮、耳朵侧脸稍暗、背景按远近分层变黑。",
    "层次要求": "同一物体表面深度连续渐变；前后物体交界处允许清晰的深度跳变(近主体边缘 vs 远背景)。"
  },

  "⚠️几何对位_SUPREME": {
    "规则": "输出与输入逐像素对齐：同构图、同画幅比例、同镜头，主体轮廓、五官位置、发际边缘分毫不差。禁止重新取景、放大缩小、平移、改姿态、改画幅。",
    "为什么": "用户将逐像素读取此图重建三维空间做灯光计算，错位=空间重建全错。"
  },

  "⚠️纯距离无外观_SUPREME": "输出只含距离信息：无固有色/无纹理/无明暗光影/无阴影/无描边/无文字。黑衣服和白皮肤若在同一距离=输出同一亮度。原图的颜色明暗只用于推断空间，绝不带入输出。",

  "execution_order": [
    "1.解析输入图三维空间(前后关系/距离层次)",
    "2.每个表面点计算到相机的距离",
    "3.按近白远黑映射为灰度",
    "4.对照输入验证轮廓逐像素对齐",

  // ============================================================
  // 高频细节 & 深度解码
  // ============================================================
  function boxBlur(src, w, h, r) {
    const tmp = new Float32Array(src.length), out = new Float32Array(src.length);
    const win = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      const row = y * w;
      let acc = 0;
      for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[row + x] = acc / win;
        acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = acc / win;
        acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];

    const r = Math.max(2, Math.round(Math.min(w, h) * 0.02));
    const blur = boxBlur(boxBlur(luma, w, h, r), w, h, r);
    const hp = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = (luma[i] - blur[i]) / 255;

    st.ph = Math.max(2, Math.round(H * sc));

  // ============================================================
  // 数学打光核心
  // 平面模式：点光源悬在画面前方(灯高)；深度模式：三维灯位(光盘XY+灯深Z)+可选遮挡投影

  const clamp255 = (v) => v < 0 ? 0 : v > 255 ? 255 : v;
  function effColor() {
    const [r, g, b] = st.p.color;
    const mx = Math.max(r, g, b) || 1;
    const s = st.p.sat;
    return [
      Math.max(0, mx + (r - mx) * s),
      Math.max(0, mx + (g - mx) * s),

  function computeLight(nd, hp, zArr, out, w, h) {

        }
        let shadow = 0;
        if (occl > 0 && d > 0) {
          let blk = 0;
          for (let s2 = 1; s2 <= OCC_STEPS; s2++) {
            const t = s2 / (OCC_STEPS + 1);
            const xi = Math.round((sx + dx * t) / aw * w - 0.5);
            const yi2 = Math.round((sy + (lyS - sy) * t) / ah * h - 0.5);
            if (xi < 0 || yi2 < 0 || xi >= w || yi2 >= h) continue;
            const rayZ = zs + (lz - zs) * t;
            if (zArr[yi2 * w + xi] * ZS < rayZ - OCC_BIAS) blk++;

        const e = p.ambient + (1 - p.ambient) * d * atten * (1 - shadow);

        if (df < 0) df = 0;
        const lift = (e + sp) * p.intensity * df;
        const dark = (1 - e) * p.shadow * p.intensity;
        out[o]     = clamp255(128 + 127 * (lift * cr - dark));
        out[o + 1] = clamp255(128 + 127 * (lift * cg - dark));

  // ============================================================
  // 轨道摆灯gizmo（机位选择器式）：图片立板立在网格地板上，灯球锁在以板为中心的

  // 单元仿射贴图：三角对齐三个角，细分后透视误差可忽略
  function texCell(g, img, sx, sy, sw, sh, p00, p10, p01) {
    const a = (p10.x - p00.x) / sw, b = (p10.y - p00.y) / sw;

    const lp = gzProject(L3.gx, L3.gy, L3.gz, W, H);
    const oc2 = gzProject(0, 0, 0, W, H);
    const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#19b5bc').trim();
    if (lp && oc2) {
      g.strokeStyle = acc; g.globalAlpha = 0.55;
      g.beginPath(); g.moveTo(lp.x, lp.y); g.lineTo(oc2.x, oc2.y); g.stroke();
      g.globalAlpha = 1;
    }
    if (lp) {
      const r = Math.max(4, Math.min(16, lp.s * (0.03 + st.p.size * 0.015)));
      g.shadowColor = acc; g.shadowBlur = 12;
      g.fillStyle = acc;
      g.beginPath(); g.arc(lp.x, lp.y, r, 0, 6.2832); g.fill();
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(255,255,255,0.9)';
      g.beginPath(); g.arc(lp.x, lp.y, r * 0.4, 0, 6.2832); g.fill();
    }
    // 读数与人话标签（方位角归一化到±180°）
    const azD = ((Math.round(az * 180 / Math.PI) + 180) % 360 + 360) % 360 - 180, elD = Math.round(el * 180 / Math.PI);
    $('gzread').innerHTML = '<div class="big">' + gzLabel(azD, elD, dist) + '</div>'
      + '<div class="sm">方位 ' + azD + '° · 仰角 ' + elD + '° · 距离 ' + dist.toFixed(2) + '</div>';
  }
  // gizmo交互
  const gizmo = $('gizmo');
  let gzDrag = null;
  gizmo.addEventListener('contextmenu', (e) => e.preventDefault());
  gizmo.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    gizmo.setPointerCapture(e.pointerId);
    gzDrag = { btn: e.button, sx: e.clientX, sy: e.clientY };
  });
  gizmo.addEventListener('pointermove', (e) => {
    if (!gzDrag) return;
    const dx = e.clientX - gzDrag.sx, dy = e.clientY - gzDrag.sy;
    gzDrag.sx = e.clientX; gzDrag.sy = e.clientY;
    if (gzDrag.btn === 2) {          // 右键拖=旋转观察
      gv.yaw += dx * 0.01;
      gv.pitch = gclamp(gv.pitch + dy * 0.008, -1.2, 1.2);
      renderGizmo();
    } else if (gzDrag.btn === 1) {   // 中键拖=灯到中心点的距离（轨道半径）
      st.ai.dist = gclamp(st.ai.dist * (1 + dy * 0.006), 0.25, 3);
      dirtyAi();
      requestRender();
    } else {                         // 左键拖=灯沿轨道走——数值雅可比换算，任意视角下灯球都精确跟手
      const W = gizmo.width || 330, H = gizmo.height || 200;
      const pl = (a2, e2) => {
        const ce2 = Math.cos(e2);
        return gzProject(st.ai.dist * ce2 * Math.sin(a2), st.ai.dist * Math.sin(e2), st.ai.dist * ce2 * Math.cos(a2), W, H);
      };
      const EPS = 0.01;
      const p0 = pl(st.ai.az, st.ai.el), pa = pl(st.ai.az + EPS, st.ai.el), pe = pl(st.ai.az, st.ai.el + EPS);
      let dAz = dx * 0.012, dEl = -dy * 0.01;   // 兜底：投影失败时退回线性映射
      if (p0 && pa && pe) {
        const a11 = (pa.x - p0.x) / EPS, a21 = (pa.y - p0.y) / EPS;
        const a12 = (pe.x - p0.x) / EPS, a22 = (pe.y - p0.y) / EPS;
        const det = a11 * a22 - a12 * a21;
        if (Math.abs(det) > 1e-3) {
          dAz = (a22 * dx - a12 * dy) / det;
          dEl = (-a21 * dx + a11 * dy) / det;
        }
      }
      st.ai.az += gclamp(dAz, -0.25, 0.25);
      st.ai.el = gclamp(st.ai.el + gclamp(dEl, -0.25, 0.25), -1.45, 1.45);
      dirtyAi();
      requestRender();
    }
  });
  const gzEnd = () => { gzDrag = null; };
  gizmo.addEventListener('pointerup', gzEnd);
  gizmo.addEventListener('pointercancel', gzEnd);
  gizmo.addEventListener('wheel', (e) => {   // 滚轮=镜头拉近推远（只动观察视角，灯位不变→不dirtyAi）

  // 模式分页：🎚实时打光 ↔ ✨AI打光（各自独立的灯位控制，共享光色/亮度/大小/形状/饱和度）

  // 预览台/摆灯台 = 卡内能放下的最大正方形（0910用户反馈"AI打光布局丑"：方台被 CSS 高度封顶后与按钮行之间留一大片空）
  // 边长 = min(可用宽, 可用高 − 按钮行 − 间距)；卡片缩放/切模式时重算，摆灯台重算后重绘
  function fitSquares() {
    const wrap = $('wrap');
    const cs = getComputedStyle(wrap);
    const gap = parseFloat(cs.rowGap) || 9;
    const innerW = wrap.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    const varsH = $('aiVars').offsetHeight;   // 多张候选缩略条占位（display:none 时为 0）
    const availH = wrap.clientHeight - $('padRow').offsetHeight - gap - (varsH ? varsH + gap : 0) - 2;
    const side = Math.max(120, Math.floor(Math.min(innerW, availH))) + 'px';
    if ($('stage').style.width === side) return;
    $('stage').style.width = side;
    $('gzwrap').style.width = side;
    if (st.aiMode) renderGizmo();
  }
  // 回调里改尺寸要推到下一帧，否则 Chromium 报 "ResizeObserver loop completed with undelivered notifications"
  let fitRaf = 0;
  const queueFit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitSquares); };
  try {
    const ro = new ResizeObserver(queueFit);
    ro.observe($('wrap')); ro.observe($('padRow')); ro.observe($('aiVars'));
  } catch (e) { window.addEventListener('resize', queueFit); }

    const r = pad.getBoundingClientRect();
    let x = ((e.clientX - r.left) / r.width - 0.5) * 2;
    let y = ((e.clientY - r.top) / r.height - 0.5) * 2;
    const d = Math.sqrt(x * x + y * y);
    if (d > 0.95) { x = x / d * 0.95; y = y / d * 0.95; }

  // ============================================================

  // 数学模式照不了的它全能画：逆光轮廓/发丝光/半透明透光/背景光晕。一次生成一次计费。
  // ============================================================
  function aiHexColor() {
    const c2 = effColor().map((v) => Math.round(gclamp(v, 0, 1) * 255));
    return '#' + c2.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  function aiColorName() {
    const [r, g, b] = effColor();
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx - mn < 0.08) return '中性白';
    let h;
    if (mx === r) h = ((g - b) / (mx - mn) + 6) % 6;
    else if (mx === g) h = (b - r) / (mx - mn) + 2;
    else h = (r - g) / (mx - mn) + 4;
    h = h * 60;
    return h < 20 ? '红' : h < 45 ? '暖橙' : h < 70 ? '金黄' : h < 160 ? '绿' : h < 200 ? '青' : h < 260 ? '蓝' : h < 320 ? '品红紫' : '红';
  }
  function buildAiLightPrompt() {
    const dist = st.ai.dist;
    const azD = ((Math.round(st.ai.az * 180 / Math.PI) + 180) % 360 + 360) % 360 - 180;
    const elD = Math.round(st.ai.el * 180 / Math.PI);

    const powerT = p.intensity < 0.5 ? '弱' : p.intensity < 1 ? '中等' : p.intensity < 1.5 ? '强' : '极强';
    const distT = dist < 0.55 ? '贴近·强烈局部' : dist < 1.0 ? '近距' : dist < 1.8 ? '中距' : '远距·大面均匀';
    const sizeT = p.size < 0.7 ? '窄束' : p.size < 1.4 ? '常规覆盖' : '宽泛大面';
    const shapeT = p.shape > 0.5 ? '光池边缘锐利(束光筒感)' : '光池边缘柔和过渡';
    return `{
  "scene_type": "CGI Lighting-Only AOV Pass·中性灰底纯光照能量图层(无Albedo无物体信息·柔光叠加用)",

  "system_role": "你是资深CGI灯光合成师，以多通道渲染思维工作：Beauty = Albedo × Lighting。下方给出一盏虚拟灯的精确空间参数，你据此只渲染【Lighting-Only光照AOV通道】，画在中性灰底上。这张图只含光照能量信息——哪里被照到、多亮、什么光色；不含任何物体表面颜色、纹理、细节、五官、发丝、服装图案、背景内容。用户将在PS以柔光模式叠回原图。",

  "灯光参数": {
    "空间位置": "${label}——方位角${azD}°(0°=主体正前方,±90°=正侧方,±180°=正后方,正值在右负值在左)，仰角${elD}°(正=高于主体俯照,负=低于主体仰照)，距离${dist.toFixed(2)}(${distT})",
    "灯在主体${behind ? '后方(逆光位)' : '前方'}": "光从该位置射向主体",
    "光色": "${aiHexColor()}(${aiColorName()})，照亮区饱和度25-50%不卡通染色",
    "功率": "${powerT}(${p.intensity.toFixed(2)}/2)——功率同时决定峰值亮度与覆盖范围",
    "覆盖": "${sizeT}，${shapeT}"
  },

  "⚠️核心机制_纯光照剥离Albedo_SUPREME": "只输出光照能量数据：被光照到的表面按法线朝向与距离升出灰基线，未照到处=干净中性灰底。绝不包含物体固有色/皮肤色/发色/织物颜色/材质纹理/五官/妆容/背景内容/主体剪影。未照亮区若显出原图内容即为错误。心智模型：手电筒照向一块空的哑光灰幕，只记录光能量的亮度分布。",

  "⚠️绝对亮度下限_SUPREME": "中性灰打底，每个像素≥灰基线，任何情况无例外。彩色光只把对应通道升到基线之上，绝不把任何通道压到基线之下。禁止一切隐性压暗：Albedo渗漏/阴影渲染/遮蔽压暗。",

  "后方灯位规则": "灯在主体后方时=逆光：主体面向相机的大部分表面接收不到直射、保持灰基线；主体轮廓边缘出现明亮的轮廓光带(发丝外缘/肩线/耳廓)，半透明材质(发丝/薄衣角/耳朵)出现透光加亮；灯所在方向的背景区域获得光照能量。这是逆光AOV的正确形态。",

  "几何与材质": "用原图三维几何(法线/遮挡/深度)只决定'光照到哪个面、多亮'：朝灯的面受光，被遮挡的面保持灰基线。材质只调节加亮幅度绝不注入物体色：皮肤柔和SSS、金属锐利镜面、织物宽缓滚降、头发各向异性高光带。",

  ],

  "validation_protocol": {

    "3_灯位检": "亮区分布符合${label}的灯位吗？${behind ? '主体正面大部分应保持灰基线、轮廓边缘亮' : '朝灯面亮、背灯面保持基线'}？不符=重做。"
  },

  "negative_prompts": [

    "输出不是原图的调亮版或压暗版，是纯光照AOV"
  ]
}`;
  }
  // 生成设置全部跟随「生图模式」卡（0910用户裁定）：渠道/模型/张数/比例/分辨率一律读全局 config，本卡不再单独选

  // 多张候选条：点缩略图切换当前灯光层

  async function runAiLight() {
    if ($('btnAi').disabled) return { ok: false, error: '正在生成中' };

        ratio: g.ratio || 'Auto',
        size: g.size || 'Auto',
        count: n,
        pctx: st.pctx,
        label: ($('gzread').textContent || '').split('方位')[0].trim(),
        // 自动置入所需（跟随生图模式卡「自动回传」开关，由主进程裁决）
        blend: 'softLight', opacity: st.p.opacity, maskMode: st.p.maskMode,
      });
      if (!rr.ok) { err('AI打光失败: ' + (rr.error || '')); return rr; }
      const list = [];
      for (const r2 of rr.results) {
        try {
          const img = await loadImg(r2.dataUrl);
          list.push({ dataUrl: r2.dataUrl, D: grabData(img, st.pw, st.ph) });
        } catch {}
      }
      if (!list.length) { err('灯光层解码失败'); return { ok: false, error: '灯光层解码失败' }; }
      st.aiVars = { list, rev };
      st.aiLight = { dataUrl: list[0].dataUrl, D: list[0].D, rev };
      showVars();
      if (st.rev !== rev) { msg('生成期间灯参数改过——本批已按旧参数作废，可重新生成'); return { ok: true }; }
      render();
      $('btnBake').disabled = false;
      step(rr.placed ? '已自动置入' : 'AI灯光层就绪 → 置入');
      msg(rr.placed
        ? '✓ AI灯光层已自动置入PS（柔光 ' + Math.round(st.p.opacity) + '%）——还想再叠一层就点置入'
        : 'AI灯光层就绪 ×' + list.length + (list.length > 1 ? '（点缩略图切换）' : '') + '——置入PS落地；改灯参数会作废');
      return { ok: true };
    } catch (e) { err(e.message || String(e)); return { ok: false, error: e.message || String(e) }; }
    finally { busy($('btnAi'), false, 'AI打光'); }
  }
  $('btnAi').addEventListener('click', () => { runAiLight(); });
  // 总控「生成」键武装到打光卡时走这里（照 Forge 的 __fireForge 同一套）
  window.__fireRelight = () => runAiLight();

  // 识别PS选区（AI打光会自动识别，这个按钮用于手动换选区）
  $('btnUpload').addEventListener('click', async () => {
    const ok = await captureSel();
    if (ok) { renderGizmo(); msg('已识别选区 ' + st.origImg.naturalWidth + '×' + st.origImg.naturalHeight + '——摆好灯点「AI打光」'); }
  });

  $('btnBake').addEventListener('click', async () => {
    const aiOk = st.aiMode && st.aiLight && st.aiLight.rev === st.rev;
    if (!st.origImg) return err('先抓选区或上传图');
    if (st.aiMode && !aiOk) return err('先点「AI打光」生成灯光层');
    if (!st.aiMode && !st.normImg) return err('先点「开始打光」');
    busy($('btnBake'), true, '置入中…');
    try {
      // AI灯光层：直接用全分辨率原始生成图置入（placeBatch会拉伸对齐选区）
      if (aiOk) {
        const r = await window.orange.relightBake({
          dataUrl: st.aiLight.dataUrl,
          pctx: st.pctx,
          blend: 'softLight',   // AI灯光层固定柔光
          opacity: st.p.opacity,
          maskMode: st.p.maskMode,
        });
        if (!r.ok) return err(r.error || '置入失败');
        const scopeTxt2 = st.p.maskMode === 'subject' ? '·只照人物' : '';
        msg('✓ AI灯光层已置入（柔光 ' + Math.round(st.p.opacity) + '%' + scopeTxt2 + '）');
        return;
      }
      const W = st.origImg.naturalWidth, H = st.origImg.naturalHeight;
      const oc = document.createElement('canvas');
      oc.width = W; oc.height = H;
      const og = oc.getContext('2d', { willReadFrequently: true });
      og.drawImage(st.origImg, 0, 0, W, H);
      const hpF = makeHighpass(og.getImageData(0, 0, W, H).data, W, H);
      let zF = null;
      if (st.depthImg) {
        og.drawImage(st.depthImg, 0, 0, W, H);
        zF = makeZ(og.getImageData(0, 0, W, H).data, W, H, st.p.zflip);
      }
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(st.normImg, 0, 0, W, H);
      const nd = g.getImageData(0, 0, W, H);
      const out = g.createImageData(W, H);
      computeLight(nd.data, hpF, zF, out.data, W, H);
      g.putImageData(out, 0, 0);
      const r = await window.orange.relightBake({
        dataUrl: c.toDataURL('image/png'),
        pctx: st.pctx,
        blend: st.p.blend,
        opacity: st.p.opacity,
        maskMode: st.p.maskMode,
      });
      if (!r.ok) return err(r.error || '置入失败');
      const scopeTxt = st.p.maskMode === 'subject' ? '·只照人物' : st.p.maskMode === 'background' ? '·只照背景' : '';
      msg('✓ 已置入（' + ({ softLight: '柔光', overlay: '叠加', linearLight: '线性光' }[st.p.blend] || st.p.blend) + ' ' + Math.round(st.p.opacity) + '%' + scopeTxt + '）——可继续调再置入一层');
    } catch (e) { err(e.message || String(e)); }
    finally { busy($('btnBake'), false, '置入PS'); }
  });

  // ============================================================
  // 初始化
  // ============================================================
  $('swCustom').value = '#ffd2a0';
  setPuck();
  syncSubjectBtn();
})();
</script>
<script src="glass.js"></script>
</body>
</html>
